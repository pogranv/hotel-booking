spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user
              uri: lb://booking-service
              predicates:
                - Path=/api/user,/api/user/**
              filters:
                - StripPrefix=1
            - id: booking
              uri: lb://booking-service
              predicates:
                - Path=/api/booking,/api/booking/**
              filters:
                - StripPrefix=1
            - id: bookings
              uri: lb://booking-service
              predicates:
                - Path=/api/bookings,/api/bookings/**
              filters:
                - StripPrefix=1
            - id: hotels
              uri: lb://hotel-service
              predicates:
                - Path=/api/hotels,/api/hotels/**
            - id: rooms
              uri: lb://hotel-service
              predicates:
                - Path=/api/rooms,/api/rooms/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId:-}] [%X{bookingId:-}] [%X{requestId:-}] [%X{event:-}] %logger - %msg%n"

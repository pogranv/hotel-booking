server:
  port: 8082

spring:
  application:
    name: hotel-service
  datasource:
    url: jdbc:h2:mem:hotel
    username: sa
    password: ""
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
      connection-init-sql: SET LOCK_TIMEOUT 10000
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: false

security:
  jwt:
    secret: 0123456789abcdef0123456789abcdef

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId:-}] [%X{bookingId:-}] [%X{requestId:-}] [%X{event:-}] %logger - %msg%n"
